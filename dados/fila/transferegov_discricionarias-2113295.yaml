  observacoes_para_revisor: 'Os documentos mostram a rejeição por impedimento técnico, mas não dizem qual
    foi o impedimento nem se houve diligência não respondida. Por isso evitável=indeterminado e confiança
    baixa. Não encontramos o parecer ou a notificação do Ministério. Há ainda um ponto de dúvida na classificação:
    o instrumento é Termo de Compromisso (discricionária, não emenda), então escolhi reprovacao_tecnica
    em vez de impedimento_emenda. O CAUC de 29/10/2026 mostra pendência em Regularidade Previdenciária
    (item 4.2), mas essa data é posterior à rejeição (05/03/2026) e nenhum documento liga a pendência
    à perda; por isso não usei a categoria cauc nem citei essa pendência no texto. Vale buscar o parecer
    técnico e o histórico de diligências na plataforma Transferegov.'
