rascunho:
  verba_id: transferegov_discricionarias-2175551
  categoria: em_apuracao
  texto: Motivo em apuração. Ainda não encontramos documento oficial que explique esta perda.
  evitavel: indeterminado
  confianca: baixa
  citacoes: []
  observacoes_para_revisor: 'Nenhum documento declara que a verba foi perdida: a proposta 2456/2026 (convênio
    de R$ 200.000,00 de repasse para videomonitoramento, emenda individual impositiva) aparece como "Proposta/Plano
    de Trabalho Complementado em Análise" no instrumento, e o último evento do histórico é PROPOSTA_COMPLEMENTADA_EM_ANALISE
    em 08/07/2026. Não há registro de rejeição, cancelamento, extinção ou perda de prazo. Houve várias
    diligências técnicas do concedente (30/06, 22/07, 27/07 e 25/08/2026), mas os pareceres não detalham
    os apontamentos (ficam em notas técnicas e anexos que não foram fornecidos), e não há documento mostrando
    que alguma diligência deixou de ser respondida. Os pareceres mencionam um possível "remanejamento"
    do recurso, sem explicar o contexto; o fato pode ser relevante, mas não sustenta nenhuma categoria.
    O CAUC de 04/11/2026 mostra duas pendências (3.2.4 e 4.2), mas é posterior aos demais documentos e
    não há registro de que a proposta tenha sido barrada por elas ou de qual data de assinatura era exigida,
    então não é possível classificar como "cauc". Faltam: o desfecho da proposta após 25/08/2026, as notas
    técnicas 783, 820 e 821/2026 e as diligências COCEL 98 e 140/2026, os registros das respostas do município
    e o documento que classificou esta verba como perdida. Vale também confirmar se a proposta continua
    em tramitação, caso em que talvez não devesse constar como perda. Observação: os pareceres de 22/07,
    27/07 e 25/08/2026 trazem prazos de atendimento (08/07 e 14/09/2026) possivelmente copiados de outros
    registros, o que merece conferência na fonte.'
