  texto: |-
    Parecer do CONCEDENTE (Analista Técnico do Concedente), 30/06/2026:
    Registra-se Diligência - NOTA TÉCNICA Nº 783/2026/ATF/COAM/CGSUSP/DSUSP/SENASP/MJ - ANÁLISE DO PLANO DE TRABALHO. Enquanto a emenda permanecer vinculada à proposta, deverão ser saneados os apontamentos técnicos constantes nas notas/anexos inseridos na plataforma. Assim, a proposta será colocada em complementação, para que o proponente promova os ajustes necessários à continuidade da análise. O atendimento deverá ocorrer no prazo estabelecido, independentemente de eventual decisão posterior sobre o remanejamento, considerando que a proposta permanece em tramitação e deve ser mantida tecnicamente apta caso o recurso indicado seja preservado. Prazo para atendimento: 08/07/2026.
