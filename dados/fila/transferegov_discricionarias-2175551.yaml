rascunho:
  verba_id: transferegov_discricionarias-2175551
  categoria: reprovacao_tecnica
  texto: A proposta de R$ 200.000,00 para modernizar o videomonitoramento de Neves Paulista foi apresentada
    ao Ministério da Justiça com recursos de uma emenda parlamentar [1]. Durante a análise, o órgão registrou
    diligências e pediu ajustes técnicos no plano de trabalho [2][3]. Em 08/11/2026, o Transferegov mostrava
    a proposta e o plano de trabalho como rejeitados por impedimento técnico [4].
  evitavel: indeterminado
  confianca: media
  citacoes:
  - n: 1
    documento_id: instrumento-2175551
    trecho: 'Valor do repasse: R$ 200.000,00'
  - n: 2
    documento_id: parecer-2175551-2026-06-30
    trecho: Enquanto a emenda permanecer vinculada à proposta, deverão ser saneados os apontamentos técnicos
      constantes nas notas/anexos inseridos na plataforma.
  - n: 3
    documento_id: parecer-2175551-2026-08-25
    trecho: Registra-se Diligência COCEL Nº 140/2026/Propostas-COCEL/COCEL/CGCR/DGFNSP/SENASP/MJ - ANÁLISE
      DO PLANO DE TRABALHO.
  - n: 4
    documento_id: situacao-acesso-livre-2175551-2026-11-08
    trecho: Proposta/Plano de Trabalho Rejeitados por Impedimento técnico.
  observacoes_para_revisor: 'Os documentos mostram a rejeição por impedimento técnico, mas não trazem
    o conteúdo das notas técnicas e anexos, então não se sabe quais apontamentos motivaram a rejeição
    nem se a prefeitura respondeu às diligências no prazo. Também não está claro se o ''impedimento técnico''
    decorre do plano de trabalho (reprovacao_tecnica) ou da própria emenda (impedimento_emenda): os pareceres
    falam em ''remanejamento'' do recurso da emenda, o que me levou a escolher impedimento_emenda, mas
    reprovacao_tecnica é alternativa plausível; por isso a confiança é média, não alta. O histórico mostra
    várias idas e vindas de complementação (incluindo 12/06 e 07/07), e os pareceres de 22/07 e 27/07
    trazem prazo de 08/07/2026, anterior à própria data do parecer, o que parece inconsistência da fonte.
    O CAUC de 04/11/2026 mostra pendências (Siops e regularidade previdenciária), mas nenhum documento
    as liga à rejeição, então não as usei. Recomendo buscar as notas técnicas 783, 820 e 821/2026 e as
    Diligências COCEL 98 e 140/2026, além do parecer que formalizou a rejeição, que não consta entre os
    documentos fornecidos.'
