  observacoes_para_revisor: 'Os documentos mostram a reprovação da proposta/plano de trabalho, mas não
    trazem o parecer do órgão nem o motivo da reprovação (falha técnica, orçamento, diligência não respondida
    etc.). Por isso a categoria reprovacao_tecnica é a leitura mais próxima, e a confiança foi limitada
    a media; se o revisor entender que o motivo não está documentado, vale trocar para em_apuracao. O
    campo ''Situação do projeto básico: Não Cadastrado'' pode ter relação com a reprovação, mas nenhum
    documento diz isso, então não foi usado. O CAUC de 29/10/2026 mostra pendência em Regularidade Previdenciária,
    mas é de data posterior à reprovação (14/01/2026) e nada liga essa pendência à perda, então não foi
    usado como causa. Falta o parecer ou despacho de reprovação no Transferegov (aba de análise/diligências)
    para fechar a explicação e avaliar se a perda era evitável.'
