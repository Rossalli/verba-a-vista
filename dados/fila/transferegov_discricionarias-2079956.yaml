  texto: A prefeitura enviou ao Ministério da Agricultura e Pecuária a proposta de convênio para comprar
    uma pá carregadeira, no valor de R$ 850.000,00 de repasse [1][2]. A proposta entrou em análise e foi
    reprovada em 14/01/2026 [3]. Hoje a situação registrada é "Proposta/Plano de Trabalho Rejeitados"
