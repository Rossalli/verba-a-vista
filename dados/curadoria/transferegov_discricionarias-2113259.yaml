texto: A prefeitura apresentou a proposta 42055/2025 ao Ministério da Agricultura e Pecuária para a compra
  de equipamentos agrícolas, no valor de R$ 549.500,00 [1]. Em 05/03/2026, a proposta passou à situação
  de rejeitada por impedimento técnico [2]. Os documentos disponíveis não detalham qual foi o impedimento
  [1][2].
