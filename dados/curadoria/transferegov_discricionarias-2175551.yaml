verba_id: transferegov_discricionarias-2175551
categoria: reprovacao_tecnica
texto: A proposta de R$ 200.000,00 para modernizar o videomonitoramento de Neves Paulista foi apresentada
  ao Ministério da Justiça com recursos de uma emenda parlamentar [1]. Durante a análise, o órgão registrou
  diligências e pediu ajustes técnicos no plano de trabalho [2][3]. Em 08/11/2026, o Transferegov mostrava
  a proposta e o plano de trabalho como rejeitados por impedimento técnico [4].
evitavel: indeterminado
