# Teste da federação de identidade com a Anthropic (sem ANTHROPIC_API_KEY).
# Troca o token OIDC do GitHub por um token de acesso da Anthropic e mostra a resposta com os tokens ocultos.
# Diagnóstico temporário: remover depois que a curadoria passar a usar a federação.

name: anthropic-wif-test
on: push
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Exchange for an Anthropic access token
        run: |
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            -H "anthropic-beta: oauth-2025-04-20,oidc-federation-2026-04-01" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_012YwuGskMBQGLPGZD4wK8sZ",
            "organization_id": "1bbd2397-64b2-43cd-9612-5565d69d4d3c",
            "service_account_id": "svac_01379u8Gk8RwKmtAySsdjuEE",
            "workspace_id": "wrkspc_01PZW1aPwuMTpgKeQMtcdc3C"
          }
          JSON
