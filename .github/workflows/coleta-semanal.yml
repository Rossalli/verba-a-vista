# Coleta semanal (spec §9, D24): coleta -> normaliza -> curadoria (gera fila) -> avisos -> commit dos dados -> publicação.
# A publicação (build + deploy) é o workflow `deploy.yml`, chamado daqui e também disparável à mão.
# Configuração necessária no repositório: docs/operacao.md.

name: Coleta semanal

on:
  schedule:
    - cron: "0 12 * * 1"   # segunda-feira, 09:00 em Brasília (UTC-3), depois da publicação do CAUC (D9)
  workflow_dispatch:
    inputs:
      ia:
        description: "Chamar a IA nesta execução (cobrado), mesmo com CURADORIA_IA desligada"
        type: boolean
        default: false
      refazer:
        description: "Gerar de novo o rascunho de quem já tem um em dados/fila/ (só vale com a IA ligada)"
        type: boolean
        default: false
      verba:
        description: "Só esta verba (id, por exemplo transferegov_discricionarias-2175551); vazio = todas as pendentes"
        type: string
        default: ""

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Coleta
        id: coleta
        # Uma fonte com falha não derruba a semana (spec §9): `make coleta` sai com erro, mas as demais já foram gravadas.
        continue-on-error: true
        env:
          PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}
        run: make coleta
      - name: Coleta com falha em alguma fonte
        if: steps.coleta.outcome == 'failure'
        run: echo "::warning::Alguma fonte falhou na coleta; o site usa o último retrato válido dela (veja o aviso 'Fonte sem retrato de hoje')."

      - name: Normaliza e publica os dados
        run: make normaliza

      - name: Rascunhos da IA (desligado até CURADORIA_IA=true)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURADORIA_IA: ${{ vars.CURADORIA_IA }}
          # opções do disparo manual (vazias na agenda); entram por variável de ambiente, nunca direto no script
          PEDIDO_IA: ${{ inputs.ia }}
          PEDIDO_REFAZER: ${{ inputs.refazer }}
          PEDIDO_VERBA: ${{ inputs.verba }}
        run: |
          if [ "$CURADORIA_IA" = "true" ] || [ "$PEDIDO_IA" = "true" ]; then
            args="--executar"
            if [ "$PEDIDO_REFAZER" = "true" ]; then args="$args --refazer"; fi
            if [ -n "$PEDIDO_VERBA" ]; then
              case "$PEDIDO_VERBA" in
                *[!A-Za-z0-9_-]*) echo "::error::id de verba inválido: use só letras, números, _ e -"; exit 1 ;;
              esac
              args="$args --id $PEDIDO_VERBA"
            fi
            echo "Curadoria com IA: python -m curadoria $args"
            make curadoria ARGS="$args"
          else
            echo "Curadoria com IA desligada (variável CURADORIA_IA != true). Plano da semana, sem custo:"
            make curadoria
          fi

      - name: Avisos (issues)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git status --porcelain -uall dados/fila > fila_novos.txt || true
          python -m nucleo.avisos --fila-novos fila_novos.txt --abrir-issues
          rm -f fila_novos.txt

      - name: Commit dos dados
        run: |
          git config user.name "verba-a-vista-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dados/
          if git diff --cached --quiet; then
            echo "Nada mudou nos dados."
          else
            git commit -m "dados: atualização de $(date -u +%F)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

  publicar:
    needs: coleta
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: write
      pages: write
      id-token: write
