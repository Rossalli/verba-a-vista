# Esqueleto do workflow diário (plano T5.1). Ajuste depois das POCs.
# Se as APIs bloquearem servidores do GitHub (T1.0), mova a coleta para um servidor no Brasil
# e deixe aqui só build + deploy disparados por push em dados/publicados/.

name: Coleta diária

on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 em Brasília (UTC-3), depois da publicação do CAUC (D9)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Coleta
        env:
          PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}
        run: make coleta
      - name: Normaliza e publica dados
        run: make normaliza
      - name: Token OIDC do GitHub para a Anthropic
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            const arquivo = `${process.env.RUNNER_TEMP}/anthropic-identity-token`;
            fs.writeFileSync(arquivo, token, { mode: 0o600 });
            core.exportVariable('ANTHROPIC_IDENTITY_TOKEN_FILE', arquivo);
      - name: Rascunhos de curadoria
        env:
          # Federação de identidade: sem ANTHROPIC_API_KEY. O SDK troca o token OIDC por um token de curta duração.
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_012YwuGskMBQGLPGZD4wK8sZ
          ANTHROPIC_ORGANIZATION_ID: 1bbd2397-64b2-43cd-9612-5565d69d4d3c
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01379u8Gk8RwKmtAySsdjuEE
          ANTHROPIC_WORKSPACE_ID: wrkspc_01PZW1aPwuMTpgKeQMtcdc3C
        run: make curadoria
      - name: Commit dos dados
        run: |
          git config user.name "verba-a-vista-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dados/
          git diff --cached --quiet || git commit -m "dados: coleta de $(date -u +%F)"
          git push
      # TODO T5.1: abrir issue quando houver arquivos novos em dados/fila/ ou situações não mapeadas

  site:
    needs: coleta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd site && npm ci && npm run build
      # TODO T5.1: deploy (GitHub Pages ou Cloudflare Pages)
