# Workflow diário (spec §9, T5.1): coleta -> normaliza -> curadoria (gera fila) -> avisos -> commit dos dados -> build -> deploy.
# Configuração necessária no repositório: docs/operacao.md.
# Se as APIs bloquearem servidores do GitHub (T1.0), mova a coleta para um servidor no Brasil
# e deixe aqui só build + deploy disparados por push em dados/publicados/.

name: Coleta diária

on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 em Brasília (UTC-3), depois da publicação do CAUC (D9)
  workflow_dispatch:
  push:
    branches: [main]
    # Aprovar uma curadoria ou mudar uma regra republica o site sem nova coleta. O commit do robô (token do
    # Actions) não dispara este workflow de novo.
    paths:
      - "dados/curadoria/**"
      - "config/**"
      - "site/**"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: publicacao
  cancel-in-progress: false

jobs:
  dados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Coleta
        id: coleta
        if: github.event_name != 'push'
        # Uma fonte com falha não derruba o dia (spec §9): `make coleta` sai com erro, mas as demais já foram gravadas.
        continue-on-error: true
        env:
          PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}
        run: make coleta
      - name: Coleta com falha em alguma fonte
        if: steps.coleta.outcome == 'failure'
        run: echo "::warning::Alguma fonte falhou na coleta; o site usa o último retrato válido dela (veja o aviso 'Fonte sem retrato de hoje')."

      - name: Normaliza e publica os dados
        run: make normaliza

      - name: Rascunhos da IA (desligado até CURADORIA_IA=true)
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURADORIA_IA: ${{ vars.CURADORIA_IA }}
        run: |
          if [ "$CURADORIA_IA" = "true" ]; then
            make curadoria ARGS="--executar"
          else
            echo "Curadoria com IA desligada (variável CURADORIA_IA != true). Plano do dia, sem custo:"
            make curadoria
          fi

      - name: Avisos (issues)
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git status --porcelain -uall dados/fila > fila_novos.txt || true
          python -m nucleo.avisos --fila-novos fila_novos.txt --abrir-issues
          rm -f fila_novos.txt

      - name: Commit dos dados
        run: |
          git config user.name "verba-a-vista-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dados/
          if git diff --cached --quiet; then
            echo "Nada mudou nos dados."
          else
            git commit -m "dados: atualização de $(date -u +%F)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

  site:
    needs: dados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # o branch já com o commit do robô
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm ci
          npm run build
          npm test   # confere, entre outras coisas, a faixa de independência em todas as páginas geradas
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
