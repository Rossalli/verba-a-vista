# Publicação do site (spec §9, D24): normaliza os dados que já estão no repositório -> commit -> build -> deploy.
# Não coleta nada. Disparos: à mão (Actions -> Publicar site -> Run workflow), `push` em `dados/curadoria/`, `config/`
# ou `site/` (aprovar uma curadoria ou mudar uma regra republica o site) e chamada do workflow `coleta-semanal.yml`.
# O commit do robô (token do Actions) não dispara este workflow de novo.

name: Publicar site

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "dados/curadoria/**"
      - "config/**"
      - "site/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicacao
  cancel-in-progress: false

jobs:
  dados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # na chamada pela coleta semanal, o branch já com o commit do robô
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Normaliza e publica os dados
        run: make normaliza

      - name: Commit dos dados
        run: |
          git config user.name "verba-a-vista-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dados/
          if git diff --cached --quiet; then
            echo "Nada mudou nos dados."
          else
            git commit -m "dados: atualização de $(date -u +%F)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

  site:
    needs: dados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # o branch já com o commit do robô
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          SITE_INDEXAR: ${{ vars.SITE_INDEXAR }}   # sem "true", todas as páginas saem com noindex (pré-lançamento)
        run: |
          npm ci
          npm run build
          npm test   # confere, entre outras coisas, a faixa de independência em todas as páginas geradas
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
