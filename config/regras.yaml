# Regras de risco, perda e curadoria (spec §5, §6, §7)

municipio:
  nome: Neves Paulista
  uf: SP
  codigo_ibge: "3532504"
  cnpj_prefeitura: "45145414000147"   # VERIFICADO 2026-10-29 (Transferegov, MUNICIPIO DE NEVES PAULISTA)
  cnpjs_fundos:                       # VERIFICADO 2026-10-29 (Transferegov parcerias, recebedores das propostas)
    - "13921776000196"                # Fundo Municipal de Saúde de Neves Paulista
    - "14513724000143"                # Fundo Municipal de Assistência Social de Neves Paulista
  inicio_recorte: "2024-01-01"

risco:
  dias_alerta_prazo: 60
  dias_obra_parada: 90
  status: [proposta, aprovada, execucao, prestacao]   # spec §5: `oportunidade`, concluída e perdida não têm em_risco (D13)
  cauc_fontes: [transferegov_discricionarias]   # D13: só transferências voluntárias; fundo a fundo fica sem alerta de CAUC
  cauc_tipos: [voluntaria, emenda_finalidade]   # spec §5
  cauc_status: [proposta, aprovada]
  cauc_ignora_situacoes_fonte:   # D17: situações da fonte em que o alerta de CAUC não vale (proposta que nem foi enviada)
    - Proposta/Plano de Trabalho Cadastrados
  prazos_monitorados: [clausula_suspensiva, fim_vigencia, prestacao_contas, adesao]
  desligadas: [impedimento_emenda]   # o campo `motivo_impedimento_plano_acao` existe no OpenAPI mas não foi visto em dado real (T1.1); ligar quando houver
  textos:
    prazo_proximo: "Prazo em {dias} {dias_unidade}"
    cauc_sem_comprovacao: "CAUC: item {item} sem comprovação ({exigencia})"
    obra_parada: "Obra parada há {dias} {dias_unidade}"
    obra_paralisada: "Obra paralisada no Obrasgov"
    impedimento_emenda: "Impedimento técnico"

perda:
  valor_perdido: nao_liberado_mais_devolvido

curadoria:
  modelo: claude-sonnet-5-5
  max_tokens: 4000
  # Sem `temperatura`: o claude-sonnet-5-5 rejeita (400) qualquer valor fora do padrão. Quem garante o resultado é a validação de citações (T3.3) e a revisão humana.
  auto_publicar: false            # spec §7.5 — manter false na fase 1
  auto_publicar_categorias: [cauc, execucao_nao_iniciada]
  texto_em_apuracao: "Motivo em apuração. Ainda não encontramos documento oficial que explique esta perda."
  selo_ia: "Explicação gerada com IA a partir dos documentos citados"

coleta:
  horario: "09:00"   # depois da publicação do CAUC (~08:11 BRT em dias úteis); D9
  fuso: America/Sao_Paulo
  portal_transparencia_req_por_min: 300   # abaixo do limite de 400 por segurança
  tentativas: 4
  backoff_inicial_s: 2
