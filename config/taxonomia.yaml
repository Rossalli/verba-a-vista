# Vocabulário do site: categorias de motivo de perda (spec §6.2, usadas também no prompt da curadoria),
# rótulos de status (spec §4) e nomes de tipo (spec §3). O CSV publicado e o site usam estes textos.

status:
  oportunidade: Oportunidade
  proposta: Proposta
  aprovada: Aprovada
  execucao: Em execução
  prestacao: Prestação de contas
  concluida: Concluída
  perdida: Rejeitada

# O que cada etapa significa (spec §4) e o que cada tipo de verba é, em linguagem simples (spec §3). O site usa estes
# textos na página "Como funciona" e em cada verba.
descricao_status:
  oportunidade: Programa, edital ou emenda que o município pode pleitear.
  proposta: Pedido cadastrado ou enviado, ainda em análise.
  aprovada: Proposta e plano de trabalho aprovados ou instrumento assinado, recurso ainda não liberado (a assinatura pode estar pendente; pode haver cláusula suspensiva).
  execucao: Recurso liberado, obra ou compra em andamento.
  prestacao: Execução encerrada, contas em análise.
  concluida: Contas aprovadas.
  perdida: Proposta rejeitada ou instrumento encerrado sem sucesso; o município não recebeu ou teve de devolver o recurso.

descricao_tipos:
  voluntaria: Acordo em que a União transfere dinheiro ao município para um projeto específico, como uma obra ou uma compra. O município apresenta uma proposta e um plano de trabalho, em geral oferece uma contrapartida e depois presta contas. Pode ser convênio, contrato de repasse (operado por um banco público, em geral a Caixa) ou termo de compromisso.
  emenda_finalidade: Dinheiro que um deputado ou senador federal indica, no orçamento da União, para uma finalidade definida no município (por exemplo, uma ambulância). O recurso chega por um convênio, contrato de repasse ou plano de ação, e o município precisa cumprir as etapas desse instrumento.
  emenda_pix: Emenda parlamentar paga direto ao município, sem convênio. O dinheiro vai para a conta do município, que apresenta um plano de ação, e o uso é fiscalizado depois.
  fundo_a_fundo: Repasse contínuo de um fundo nacional (como o da saúde ou o da assistência social) para o fundo do município, para manter serviços da área. Não precisa de convênio, mas o município precisa estar habilitado e cumprir as regras do programa.
  programa_adesao: Programa federal aberto aos municípios que aderem ou são selecionados dentro de um prazo (por exemplo, programas do FNDE e do Novo PAC). Quem não adere ou não se candidata a tempo perde a oportunidade.
  constitucional: Parte da arrecadação federal que a Constituição manda repassar aos municípios (como o FPM e o ITR). É automática e aqui aparece só como número de referência.

sem_status: Situação em análise   # verba cuja situação na fonte ainda não está no status_map (spec §4)

tipos:
  voluntaria: Convênio, contrato de repasse ou termo de compromisso
  emenda_finalidade: Emenda com finalidade definida
  emenda_pix: Emenda Pix (transferência especial)
  fundo_a_fundo: Repasse fundo a fundo
  programa_adesao: Programa por adesão ou seleção
  constitucional: Transferência constitucional

categorias:
  prazo_proposta:
    rotulo: Prazo de proposta ou adesão perdido
    descricao: O município não enviou a proposta ou não aderiu ao programa dentro do prazo.
    evitavel_tipico: sim
  reprovacao_tecnica:
    rotulo: Reprovação técnica
    descricao: Projeto, plano de trabalho ou orçamento reprovado na análise do órgão, ou diligência não respondida no prazo.
    evitavel_tipico: sim
  impedimento_emenda:
    rotulo: Impedimento técnico de emenda
    descricao: Emenda parlamentar com impedimento técnico (objeto incompatível, documentação, beneficiário) não superado.
    evitavel_tipico: em_parte
  cauc:
    rotulo: Irregularidade no CAUC
    descricao: O município tinha pendência no CAUC na data exigida para assinar ou receber.
    evitavel_tipico: sim
  clausula_suspensiva:
    rotulo: Cláusula suspensiva vencida
    descricao: Condição exigida no instrumento (projeto, licença, terreno) não cumprida no prazo, e o instrumento foi extinto.
    evitavel_tipico: sim
  execucao_nao_iniciada:
    rotulo: Execução não iniciada ou paralisada
    descricao: "A obra ou compra não começou no prazo, ou foi paralisada e cancelada (por exemplo, licitação deserta ou abandono da empresa)."
    evitavel_tipico: em_parte
  contrapartida:
    rotulo: Contrapartida não garantida
    descricao: O município não tinha dotação orçamentária para a contrapartida exigida.
    evitavel_tipico: sim
  glosa_devolucao:
    rotulo: Devolução ou glosa na prestação de contas
    descricao: Despesas não aceitas ou saldo não usado tiveram de ser devolvidos.
    evitavel_tipico: em_parte
  decisao_externa:
    rotulo: Decisão externa
    descricao: Corte orçamentário, extinção de programa ou decisão judicial, sem ação possível da prefeitura.
    evitavel_tipico: nao
  em_apuracao:
    rotulo: Motivo em apuração
    descricao: Os documentos disponíveis não permitem explicar a perda.
    evitavel_tipico: indeterminado
