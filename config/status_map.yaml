# Mapeamento: situação na fonte -> status_site (spec §4)
#
# ATENÇÃO: as fontes com `verificado: null` ainda têm valores de EXEMPLO, não verificados contra
# os dados reais. Substitua pelos valores exatos que a POC encontrar e mude `verificado` para a
# data da verificação. As fontes com data foram verificadas (ver docs/fontes.md).
#
# Comparação: sem diferenciar maiúsculas/minúsculas e acentos, após remover espaços extras.
# Situação que não casar com nada -> status_site: null + relatório de não mapeadas (nunca chutar).

status_validos: [oportunidade, proposta, aprovada, execucao, prestacao, concluida, perdida]

fontes:
  # T1.2, verificado em 29/10/2026 nos CSV em lote do Siconv (carga de 17/07/2026), dados de
  # Neves Paulista. Só estão mapeados os valores OBSERVADOS (decisão da autora em 29/10/2026).
  # Regra de uso (T2.2): se a proposta tem convênio em siconv_convenio, vale SIT_CONVENIO;
  # senão vale SIT_PROPOSTA; propostas de siconv_proposta_cancelada usam SIT_PROPOSTA.
  transferegov_discricionarias_proposta:
    verificado: 2026-10-29
    campo: SIT_PROPOSTA   # siconv_proposta e siconv_proposta_cancelada
    mapa:
      proposta:
        - "Proposta/Plano de Trabalho Cadastrados"
        - "Proposta/Plano de Trabalho Enviado para Análise"
        - "Proposta/Plano de Trabalho em Análise"
        - "Proposta/Plano de Trabalho Complementado em Análise"
        - "Proposta Aprovada e Plano de Trabalho em Análise"   # plano ainda em análise
        - "Proposta Aprovada e Plano de Trabalho Complementado em Análise"
      aprovada:
        - "Proposta/Plano de Trabalho Aprovados"   # assinatura pode estar pendente (ver spec §4)
      perdida:
        - "Proposta/Plano de Trabalho Rejeitados"
        - "Proposta/Plano de Trabalho Rejeitados por Impedimento técnico"
        - "Proposta/Plano de Trabalho Cancelados"
        - "Proposta Eliminada em Chamamento Público"

  transferegov_discricionarias_convenio:
    verificado: 2026-10-29
    campo: SIT_CONVENIO   # siconv_convenio
    mapa:
      proposta:
        - "Proposta/Plano de Trabalho Complementado em Análise"
      aprovada:
        - "Proposta/Plano de Trabalho Aprovado"
      execucao:
        - "Em execução"
      prestacao:
        - "Prestação de Contas em Análise"
        - "Prestação de Contas Rejeitada"   # sem prova de devolução; T2.4 pode promover a perdida (decisão da autora)
      concluida:
        - "Prestação de Contas Aprovada"
        - "Prestação de Contas Concluída"
      perdida:
        - "Convênio Anulado"
    # Documentados no dicionário oficial e não observados no município: "Prestação de Contas
    # enviada para Análise", "Prestação de Contas em Complementação", "Inadimplente".

  # T1.1, verificado em 29/10/2026 nos dados de Neves Paulista. Só estão mapeados os valores
  # OBSERVADOS; os documentados no OpenAPI e ainda não vistos ficam em comentário e caem no
  # relatório de situações não mapeadas se aparecerem (decisão da autora em 29/10/2026).
  transferegov_parcerias:
    verificado: 2026-10-29
    campo: situacao_proposta   # parcerias/proposta; parcerias/parceria usa in_situacao_parceria com o mesmo valor
    mapa:
      aprovada:
        - "Aprovada"   # observado em 12 propostas e 12 parcerias; sem assinatura nem pagamento nos dados
    # Documentados, não observados: proposta: Em Elaboração, Em Análise, Rejeitada, Inativada;
    # parceria: Em Elaboração, Em Análise, Em Captação, Rejeitada, Inativa;
    # in_situacao_analise: Proposta e Plano de Trabalho Em Complementação / em Análise /
    # Enviados para Análise / Enviado para Complementação.

  transferegov_especiais:
    verificado: null   # sem registros do município em 29/10/2026 (T1.1): nada observado
    campo: situacao_plano_acao   # especiais/planos-acao-especiais; plano de trabalho: situacao_plano_trabalho
    mapa: {}
    # Documentados, não observados: plano de ação: CIENTE, IMPEDIDO (histórico: AGUARDANDO_CIENCIA,
    # AGUARDANDO_CONCLUSAO_PLANO_TRABALHO, IMPEDIDO_REJEICAO_PLANO_TRABALHO); plano de trabalho
    # (histórico): Aguardando envio para Análise, Aprovado, Em Ajuste do Plano de Trabalho,
    # Em Complementação, Em Elaboração, Enviado para Análise, Legado ADPF 854 STF / NT - TCU, Reprovado.

  transferegov_fundoafundo:
    verificado: 2026-10-29
    campo: situacao_plano_acao   # fundoafundo/planos-acao; termos-adesao usa situacao_termo_adesao
    mapa:
      aprovada:
        - "AUTORIZADO"   # observado em 2 planos de ação (um com vigência até 2024-12-31, outro até 2029-12-31; saldo 0 nos dois)
        - "ASSINADO"     # situacao_termo_adesao, observado em 2 termos
    # Documentados, não observados: termo de adesão: EM_ELABORACAO, ENVIADO;
    # relatorios-gestao: EM_ELABORACAO, ENVIADO_ANALISE, ENVIADO_ANALISE_CONSELHO, EM_COMPLEMENTACAO,
    # ANALISE_CONCLUIDA, ANALISE_CONCLUIDA_CONSELHO, REJEITADO. Valores de situacao_plano_acao: o OpenAPI não lista.

  # T1.3, verificado em 29/10/2026. O Obrasgov é fonte AUXILIAR e NÃO define status_site
  # (decisão da autora em 29/10/2026, D8; spec §4): o mapa fica vazio de propósito.
  # No município só foi observada "Cadastrada" (4 projetos). Valores do OpenAPI: Cadastrada,
  # Cancelada, Concluída, Em execução, Inacabada, Paralisada ("Suspensa" não existe).
  obrasgov:
    verificado: 2026-10-29
    campo: situacao
    mapa: {}
    # "Paralisada" não muda o status: gera em_risco (regra obra_parada), junto com a falta de
    # atualização de execução física. "Cancelada" vira sinal e documento para a curadoria.
    # "Inacabada" não é citada na spec: não é sinal até a autora decidir.
    sinais_risco: ["Paralisada"]

  # T1.4, verificado em 29/10/2026. O Portal é fonte de COMPLEMENTO e NÃO define status_site
  # (decisão da autora em 29/10/2026, D11; spec §4): o mapa fica vazio de propósito.
  # Situações observadas em `convenios` (63 convênios): CONCLUÍDO, PRESTAÇÃO DE CONTAS APROVADA,
  # ARQUIVADO, CONVÊNIO ANULADO, NORMAL, EM EXECUÇÃO, PRESTAÇÃO DE CONTAS EM ANÁLISE, EXCLUÍDO,
  # ADIMPLENTE, INADIMPLÊNCIA SUSPENSA, PRESTAÇÃO DE CONTAS REJEITADA. Nos 19 instrumentos que casam
  # com o Siconv, NORMAL equivale a "Prestação de Contas Concluída" (3 de 3).
  portal_transparencia:
    verificado: 2026-10-29
    campo: situacao
    mapa: {}
